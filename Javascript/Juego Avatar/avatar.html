<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LA LEYENDA DE AANG: AVATAR</title>
  </head>
  <body>
    <h1>AVATAR</h1>

    <section id="seleccion-personaje">
      <h2>Elige tu personaje</h2>

      <input type="radio" name="personaje" id="zuko" />
      <label for="zuko">Zuko</label>
      <input type="radio" name="personaje" id="aang" />
      <label for="aang">Aang</label>
      <input type="radio" name="personaje" id="katara" />
      <label for="katara">Katara</label>
      <input type="radio" name="personaje" id="toph" />
      <label for="toph">Toph</label>

      <button id="boton-seleccionar">Seleccionar</button>
    </section>

    <section id="seleccionar-ataque">
      <h2>Selecciona tu ataque</h2>
      <p>Tu personaje tiene <span>3</span> vidas</p>
      <p>Los personajes del enemigo tienen <span>3</span> vidas</p>

      <button id="boton-fuego">Fuego</button>
      <button id="boton-agua">Agua</button>
      <button id="boton-tierra">Tierra</button>
      <button id="boton-aire">Aire</button>
    </section>

    <section id="mensaje">
      <!-- Aquí se mostrará el mensaje del resultado del ataque -->
      <p>
        Tu personaje ataco con todo el poder del fuego, el enemigo ataco con
        medio poder de tierra, GANASTE
      </p>
    </section>

    <section id="reiniciar">
      <button id="boton-reiniciar">Reiniciar juego</button>
    </section>

    <script src="js/avatar.js"></script>
  </body>
</html>
