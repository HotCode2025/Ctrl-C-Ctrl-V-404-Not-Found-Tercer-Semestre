<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clase08ElSaltoDelCaballo</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color:white;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:20px;
    }

    .logo{
      font-size:90px;
      margin-top:10px;
      animation: flotar 3s ease-in-out infinite;
      text-shadow:0 0 25px rgba(255,255,255,0.4);
    }

    @keyframes flotar{
      0%{ transform:translateY(0px); }
      50%{ transform:translateY(-10px); }
      100%{ transform:translateY(0px); }
    }

    h1{
      margin-top:10px;
      font-size:42px;
    }

    p{
      margin-top:10px;
      color:#cbd5e1;
      text-align:center;
      max-width:800px;
      line-height:1.5;
    }

    button{
      margin-top:25px;
      padding:14px 30px;
      border:none;
      border-radius:14px;
      background:#38bdf8;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 0 20px rgba(56,189,248,0.4);
    }

    button:hover{
      transform:scale(1.05);
      background:#0ea5e9;
    }

    .contenedor{
      margin-top:35px;
      display:flex;
      gap:35px;
      align-items:flex-start;
      flex-wrap:wrap;
      justify-content:center;
    }

    .tablero{
      display:grid;
      grid-template-columns: repeat(8, 75px);
      grid-template-rows: repeat(8, 75px);
      border:6px solid white;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 0 30px rgba(255,255,255,0.2);
    }

    .casilla{
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      font-weight:bold;
      transition:0.4s;
    }

    .blanca{
      background:#f8fafc;
      color:black;
    }

    .negra{
      background:#475569;
      color:white;
    }

    .visitada{
      background:#22c55e !important;
      color:white !important;
    }

    .caballo{
      font-size:32px;
      animation: brillo 1s infinite alternate;
    }

    @keyframes brillo{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.12);
      }
    }

    .numero{
      position:absolute;
      bottom:4px;
      right:6px;
      font-size:11px;
    }

    .panel{
      width:320px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:15px;
      padding:20px;
      backdrop-filter:blur(10px);
      box-shadow:0 0 25px rgba(0,0,0,0.3);
    }

    .panel h2{
      margin-bottom:15px;
      text-align:center;
    }

    .resultado{
      height:520px;
      overflow-y:auto;
      padding-right:8px;
    }

    .movimiento{
      background:rgba(255,255,255,0.08);
      padding:10px;
      border-radius:10px;
      margin-bottom:10px;
      animation: aparecer 0.4s;
    }

    @keyframes aparecer{
      from{
        opacity:0;
        transform:translateX(20px);
      }
      to{
        opacity:1;
        transform:translateX(0);
      }
    }

  </style>
</head>

<body> 

  <div class="logo">♞</div>
  
  <h1>"Ctrl C + Ctrl V = 404 Not Found"</h1>

  <h2>Salto del Caballo</h2>

  <p>
    Algoritmo Backtracking. Recorrido del caballo por las 64 casillas sin repetir ninguna. con historial por donde va pasando
  </p>

  <button onclick="iniciar()">
    Iniciar Recorrido
  </button>

  <div class="contenedor">

    <div class="tablero" id="tablero"></div>

    <div class="panel">

      <h2>📋 Recorrido</h2>

      <div class="resultado" id="resultado"></div>

    </div>

  </div>

  <script>

    const N = 8;

    const movX = [2,1,-1,-2,-2,-1,1,2];
    const movY = [1,2,2,1,-1,-2,-2,-1];

    let tablero = Array.from({ length: N }, () =>
      Array(N).fill(-1)
    );

    const tableroHTML = document.getElementById("tablero");
    const resultadoHTML = document.getElementById("resultado");

    function crearTablero(){

      tableroHTML.innerHTML = "";

      for(let i=0; i<N; i++){

        for(let j=0; j<N; j++){

          const casilla = document.createElement("div");

          casilla.classList.add("casilla");

          if((i+j)%2===0){
            casilla.classList.add("blanca");
          }else{
            casilla.classList.add("negra");
          }

          casilla.id = `c-${i}-${j}`;

          tableroHTML.appendChild(casilla);
        }
      }
    }

    function esValido(x,y){

      return (
        x >= 0 &&
        y >= 0 &&
        x < N &&
        y < N &&
        tablero[x][y] === -1
      );
    }

    function resolver(x,y,movimiento){

      if(movimiento === N*N){
        return true;
      }

      for(let i=0; i<8; i++){

        let siguienteX = x + movX[i];
        let siguienteY = y + movY[i];

        if(esValido(siguienteX,siguienteY)){

          tablero[siguienteX][siguienteY] = movimiento;

          if(
            resolver(
              siguienteX,
              siguienteY,
              movimiento + 1
            )
          ){
            return true;
          }

          tablero[siguienteX][siguienteY] = -1;
        }
      }

      return false;
    }

    async function mostrarSolucion(){

      for(let paso=0; paso<64; paso++){

        for(let i=0; i<N; i++){

          for(let j=0; j<N; j++){

            if(tablero[i][j] === paso){

              document.querySelectorAll(".caballo")
              .forEach(c => c.remove());

              const casilla =
                document.getElementById(`c-${i}-${j}`);

              casilla.classList.add("visitada");

              casilla.innerHTML = `
                <div class="caballo">♞</div>
                <div class="numero">${paso}</div>
              `;

              // PANEL LATERAL
              const movimiento =
                document.createElement("div");

              movimiento.classList.add("movimiento");

              movimiento.innerHTML = `
                <strong>Movimiento ${paso}</strong><br>
                Casilla: (${i}, ${j})
              `;

              resultadoHTML.appendChild(movimiento);

              resultadoHTML.scrollTop =
                resultadoHTML.scrollHeight;

              // MÁS PAUSADO
              await new Promise(r => setTimeout(r, 500));
            }
          }
        }
      }
    }

    async function iniciar(){

      crearTablero();

      resultadoHTML.innerHTML = "";

      tablero = Array.from({ length: N }, () =>
        Array(N).fill(-1)
      );

      tablero[0][0] = 0;

      const solucion = resolver(0,0,1);

      if(solucion){

        await mostrarSolucion();

      }else{

        alert("No existe solución");

      }
    }

    crearTablero();

  </script>

</body>
</html>
