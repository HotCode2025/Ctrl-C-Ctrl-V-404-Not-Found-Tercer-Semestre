<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ctrl C + Ctrl V = 404 Not Found</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <section>
        <!-- Luces de fondo -->
        <div class="color"></div>
        <div class="color"></div>
        <div class="color"></div>
        
        <!-- Caja principal -->
        <div class="window">

            <!-- Barra superior -->
            <div class="topbar">
                <span>Windows XP System</span>
                <div class="window-buttons">
                    <span>—</span>
                    <span>□</span>
                    <span>X</span>
                </div>
            </div>

            <!-- Contenido -->
            <div class="content">
                <div class="icon">
                    💻
                </div>
                <h1>Ctrl C + Ctrl V</h1>
                <h2>404 Not Found</h2>
                <p class="text">
                    Login required to access the group system
                </p>

                <!-- Formulario -->
                <form id="loginForm">
                    <div class="inputBox">
                        <input 
                        type="text" 
                        id="usuario"
                        placeholder="Username">
                    </div>

                    <div class="inputBox">
                        <input 
                        type="password" 
                        id="password"
                        placeholder="Password">
                    </div>

                    <div class="buttonBox">
                        <input 
                        type="submit" 
                        value="ENTER SYSTEM">
                    </div>
                </form>

                <!-- Error -->
                <div id="errorBox" class="error-box">
                    <h3>FATAL ERROR</h3>
                    <p>ERROR CODE: 0x000404</p>
                    <p>ACCESS DENIED</p>
                </div>
            </div>
        </div>
    </section>
    <script src="./codigo.js"></script>
</body>
</html>
